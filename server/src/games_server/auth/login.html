<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Sign in</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f5f4;
        --panel: #ffffff;
        --text: #1c1917;
        --muted: #57534e;
        --border: #d6d3d1;
        --accent: #1d4ed8;
        --error: #b91c1c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c0a09;
          --panel: #1c1917;
          --text: #f5f5f4;
          --muted: #a8a29e;
          --border: #44403c;
          --accent: #60a5fa;
          --error: #f87171;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.5 system-ui, sans-serif;
      }
      form {
        width: min(20rem, calc(100vw - 2rem));
        padding: 1.5rem;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      h1 {
        margin: 0 0 1rem;
        font-size: 1.25rem;
      }
      label {
        display: block;
        margin-bottom: 0.25rem;
        color: var(--muted);
        font-size: 0.875rem;
      }
      input,
      button {
        box-sizing: border-box;
        width: 100%;
        padding: 0.5rem 0.75rem;
        border-radius: 6px;
        font: inherit;
      }
      input {
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
      }
      button {
        margin-top: 1rem;
        border: 0;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      .error {
        margin: 0 0 1rem;
        color: var(--error);
      }
    </style>
  </head>
  <body>
    <form method="post" action="/login">
      <h1>Sign in</h1>
      $error_html
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus />
      <button type="submit">Enter</button>
    </form>
  </body>
</html>
